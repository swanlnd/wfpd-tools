<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World FP Day — Money Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
  :root{
    --paper:#f4f2ea; --card:#fbfaf5; --ink:#16241e; --muted:#586a60;
    --line:#dcdacc; --line-strong:#c9c6b4; --forest:#1f4a3d; --brass:#9c701f; --brass-soft:#ecdfc2;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0e1512; --card:#15201b; --ink:#eaf1ec; --muted:#a4b4aa;
    --line:#243029; --line-strong:#31423a; --forest:#8fc9b3; --brass:#dcb166; --brass-soft:#3a3120;
  }}
  :root[data-theme="dark"]{
    --paper:#0e1512; --card:#15201b; --ink:#eaf1ec; --muted:#a4b4aa;
    --line:#243029; --line-strong:#31423a; --forest:#8fc9b3; --brass:#dcb166; --brass-soft:#3a3120;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);}
  .tabbar{
    position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;gap:8px;justify-content:center;padding:12px 16px;flex-wrap:wrap;
  }
  .tab{
    font-family:"IBM Plex Sans",sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;
    border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    padding:10px 20px;border-radius:100px;transition:.15s;
  }
  .tab:hover{border-color:var(--forest);color:var(--forest);}
  .tab[aria-selected="true"]{background:var(--forest);border-color:var(--forest);color:#f4f2ea;}
  .tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .frame{width:100%;border:0;display:block;min-height:600px;overflow:hidden;background:var(--paper);}
  /* fit-to-screen presenting mode on wide, short (landscape) displays */
  body.present{overflow:hidden;height:100vh;display:flex;flex-direction:column;}
  body.present .tabbar{flex:none;}
  body.present .frame{flex:1 1 auto;height:auto !important;min-height:0;}
</style>
</head>
<body>
  <div class="tabbar" role="tablist" aria-label="Money tools">
    <button class="tab" data-i="0" role="tab" aria-selected="true">🎯 Budgeting</button>
    <button class="tab" data-i="1" role="tab" aria-selected="false">📈 The Cost of Waiting</button>
    <button class="tab" data-i="2" role="tab" aria-selected="false">🪙 Buying the Dips</button>
    <button class="tab" data-i="3" role="tab" aria-selected="false">🧭 Start Investing</button>
    <button class="tab" data-i="4" role="tab" aria-selected="false">🔒 Choosing a Tool</button>
    <button class="tab" data-i="5" role="tab" aria-selected="false">🛠️ Setup Guide</button>
  </div>
  <iframe id="f0" class="frame" src="budget.html" title="Budgeting tool"></iframe>
  <iframe id="f1" class="frame" src="compound.html" title="The Cost of Waiting tool" style="display:none"></iframe>
  <iframe id="f2" class="frame" src="dca.html" title="Buying the Dips tool" style="display:none"></iframe>
  <iframe id="f3" class="frame" src="investing.html" title="Getting Started with Investing guide" style="display:none"></iframe>
  <iframe id="f4" class="frame" src="choosing.html" title="Choosing a Budgeting Tool guide" style="display:none"></iframe>
  <iframe id="f5" class="frame" src="setup.html" title="Budget sheet and form setup guide" style="display:none"></iframe>

<script>
(function(){
  var frames=[document.getElementById('f0'),document.getElementById('f1'),document.getElementById('f2'),document.getElementById('f3'),document.getElementById('f4'),document.getElementById('f5')];
  var mqPresent=window.matchMedia('(min-width:920px) and (min-aspect-ratio:13/10)');
  function present(){return mqPresent.matches;}
  function fit(f){
    if(present()) return;               // in present mode CSS controls height
    try{
      var d=f.contentDocument; if(!d) return;
      var h=Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
      if(h>0) f.style.height=h+"px";
    }catch(e){}
  }
  function applyMode(){
    if(present()){
      document.body.classList.add('present');
      frames.forEach(function(f){ f.style.height=''; });   // clear px so flex fills
    } else {
      document.body.classList.remove('present');
      frames.forEach(function(f){ if(f.style.display!=='none') fit(f); });
    }
  }
  mqPresent.addEventListener('change', applyMode);
  frames.forEach(function(f){
    f.addEventListener('load',function(){
      fit(f);
      setTimeout(function(){fit(f)},350);   // after web fonts settle
      setTimeout(function(){fit(f)},1200);
      try{ new ResizeObserver(function(){fit(f)}).observe(f.contentDocument.body); }catch(e){}
    });
  });
  function show(i){
    frames.forEach(function(f,j){ f.style.display = j===i ? "block" : "none"; });
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute("aria-selected", (+b.dataset.i)===i); });
    fit(frames[i]);
    setTimeout(function(){fit(frames[i])},60);
  }
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){ show(+this.dataset.i); });
  });
  window.addEventListener('resize',function(){ applyMode(); frames.forEach(function(f){ if(f.style.display!=="none") fit(f); }); });
  applyMode();
})();
</script>
</body>
</html>
